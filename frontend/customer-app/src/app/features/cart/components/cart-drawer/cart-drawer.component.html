<div class="cart-backdrop" *ngIf="cartService.isDrawerOpen()" (click)="cartService.closeDrawer()"></div>

<aside class="cart-drawer" [class.open]="cartService.isDrawerOpen()">
  <div class="drawer-header">
    <h3>Your Shopping Cart</h3>
    <button class="close-btn" (click)="cartService.closeDrawer()">×</button>
  </div>

  <div class="drawer-body">
    <div *ngIf="cartService.items().length === 0" class="empty-cart">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      <p>Your cart is currently empty.</p>
    </div>

    <div class="cart-items-list" *ngIf="cartService.items().length > 0">
      <div class="cart-item-row" *ngFor="let item of cartService.items()">
        <img [src]="item.product.imageUrl" class="cart-item-img" [alt]="item.product.name" />
        <div class="cart-item-info">
          <h5>{{ item.product.name }}</h5>
          <div class="cart-item-price">{{ item.product.price | priceFormat }}</div>
          <div class="cart-qty-controls">
            <button (click)="cartService.updateQuantity(item.product.id, item.quantity - 1)">-</button>
            <span>{{ item.quantity }}</span>
            <button (click)="cartService.updateQuantity(item.product.id, item.quantity + 1)">+</button>
            <button class="remove-btn" (click)="cartService.removeFromCart(item.product.id)" title="Remove item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="drawer-footer" *ngIf="cartService.items().length > 0">
    <div class="summary-row">
      <span>Subtotal</span>
      <span>{{ cartService.totalPrice() | priceFormat }}</span>
    </div>
    <div class="summary-row">
      <span>Shipping (Standard)</span>
      <span class="free-tag">FREE</span>
    </div>
    <div class="summary-row total-row">
      <span>Grand Total</span>
      <span>{{ cartService.totalPrice() | priceFormat }}</span>
    </div>
    <button class="checkout-btn" (click)="onCheckout()">
      Proceed to Checkout (Razorpay Secure)
    </button>
  </div>
</aside>
