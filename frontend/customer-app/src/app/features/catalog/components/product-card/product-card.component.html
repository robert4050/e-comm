<div class="product-card">
  <div class="card-image-wrap">
    <img [src]="product.imageUrl" [alt]="product.name" class="card-img" />
    <span class="category-tag">{{ product.category }}</span>
    <span class="brand-tag" *ngIf="product.brand">{{ product.brand }}</span>
  </div>
  <div class="card-body">
    <h4 class="product-title">{{ product.name }}</h4>
    <p class="product-desc" [innerHTML]="product.description"></p>
    <div class="card-footer">
      <div class="price-wrap">
        <span class="amount">{{ product.price | priceFormat }}</span>
      </div>
      <button class="add-to-cart-btn" (click)="onAddToCart()">
        Add to Cart
      </button>
    </div>
    <div class="stock-status">
      <span class="stock-dot"></span>
      <span>{{ product.stockQuantity }} units in stock</span>
    </div>
  </div>
</div>
