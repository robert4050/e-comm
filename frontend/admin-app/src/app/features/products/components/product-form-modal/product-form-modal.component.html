<div class="modal-backdrop" *ngIf="isOpen">
  <div class="modal-card">
    <div class="modal-header">
      <h3>{{ editingProduct ? 'Edit Product' : 'Create New Product' }}</h3>
      <button class="close-btn" (click)="onClose()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>SKU Code</label>
        <input type="text" [(ngModel)]="form.sku" placeholder="e.g. SKU-LAP-999" [disabled]="!!editingProduct" />
      </div>
      <div class="form-group">
        <label>Product Name</label>
        <input type="text" [(ngModel)]="form.name" placeholder="e.g. Pro Noise-Cancelling Headphones" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Price ($)</label>
          <input type="number" step="0.01" [(ngModel)]="form.price" />
        </div>
        <div class="form-group">
          <label>Stock Quantity</label>
          <input type="number" [(ngModel)]="form.stockQuantity" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Category</label>
          <select [(ngModel)]="form.category">
            <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
          </select>
        </div>
        <div class="form-group">
          <label>Brand</label>
          <select [(ngModel)]="form.brand">
            <option value="">Select Brand (Optional)</option>
            <option *ngFor="let b of brands" [value]="b">{{ b }}</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Image URL</label>
        <input type="text" [(ngModel)]="form.imageUrl" placeholder="https://..." />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea rows="3" [(ngModel)]="form.description" placeholder="Product details, features, specifications..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" (click)="onClose()">Cancel</button>
      <button class="btn btn-primary" (click)="onSubmit()">
        {{ editingProduct ? 'Save Changes' : 'Create & Dispatch Event' }}
      </button>
    </div>
  </div>
</div>
