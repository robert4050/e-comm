server:
  port: ${PRODUCT_SERVICE_PORT:${SERVER_PORT:8081}}

spring:
  application:
    name: product-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:ecomm_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ecomm_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${CLERK_JWKS_URL:${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:https://clerk.e-comm.local/.well-known/jwks.json}}

clerk:
  publishable-key: ${CLERK_PUBLISHABLE_KEY:pk_test_placeholder}
  secret-key: ${CLERK_SECRET_KEY:sk_test_placeholder}
  issuer-uri: ${CLERK_ISSUER_URI:https://clerk.e-comm.local}
  jwks-url: ${CLERK_JWKS_URL:https://clerk.e-comm.local/.well-known/jwks.json}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:AC_demo_mock_account_sid}
  auth-token: ${TWILIO_AUTH_TOKEN:mock_auth_token}
  from-number: ${TWILIO_PHONE_NUMBER:+15005550006}
  enabled: ${TWILIO_ENABLED:false}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder_key_id}
  key-secret: ${RAZORPAY_KEY_SECRET:}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  kafka:
    topics:
      product-events: product.events.v1

logging:
  level:
    root: INFO
    com.ecomm: INFO
    com.ecomm.common.aspect: DEBUG
